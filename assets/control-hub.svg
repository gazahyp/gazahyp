<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-label="NEXORA control hub: game discovery, hardware monitoring, reversible booster and optimizer, signed auto-update.">
  <!-- NEXORA // CONTROL HUB — 2x2 module grid. Self-contained dark background;
       designed at 900px so it renders 1:1 in GitHub's README column. -->
  <defs>
    <linearGradient id="cRailA" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cRailB" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="cGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#141925" stroke-width="1"/>
    </pattern>
    <radialGradient id="cHalo" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="404" rx="14" fill="#0A0713"/>
  <rect width="900" height="404" rx="14" fill="url(#cGrid)"/>
  <rect width="900" height="230" fill="url(#cHalo)"/>
  <rect x="0.5" y="0.5" width="899" height="403" rx="14" fill="none" stroke="#232A3A"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="5" height="16" fill="#A855F7"/>
  <text x="36" y="34" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2.4" fill="#E6E9F0">NEXORA // CONTROL HUB</text>
  <text x="880" y="34" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.8" fill="#4E5A70">WINDOWS x64</text>
  <path d="M20 48 H880" stroke="#232A3A" stroke-width="1"/>
  <path d="M20 48 H150" stroke="#A855F7" stroke-width="2"/>

  <!-- 01 GAME DISCOVERY -->
  <rect x="20" y="66" width="420" height="150" rx="10" fill="#10131C" stroke="#232A3A"/>
  <rect x="20" y="66" width="4" height="150" rx="2" fill="url(#cRailA)"/>
  <text x="44" y="96" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="2.2" fill="#22D3EE">01 // GAME DISCOVERY</text>
  <text x="44" y="126" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F3F5F9">One library, every launcher</text>
  <text x="44" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">Detects and formats what you already</text>
  <text x="44" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">own across Steam, Epic, Riot and GOG.</text>
  <text x="44" y="192" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#4E5A70">FILTER &#183; FAVORITES &#183; ONE-CLICK LAUNCH</text>
  <rect x="44" y="200" width="70" height="2.5" fill="#22D3EE" opacity="0.7"/>

  <!-- 02 HARDWARE MONITOR -->
  <rect x="460" y="66" width="420" height="150" rx="10" fill="#10131C" stroke="#232A3A"/>
  <rect x="460" y="66" width="4" height="150" rx="2" fill="url(#cRailB)"/>
  <text x="484" y="96" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="2.2" fill="#22D3EE">02 // HARDWARE MONITOR</text>
  <text x="484" y="126" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F3F5F9">Live system telemetry</text>
  <text x="484" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">CPU, RAM, GPU, VRAM, storage and</text>
  <text x="484" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">network, read from the Rust layer.</text>
  <text x="484" y="192" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#4E5A70">SAMPLE HISTORY &#183; 1H / 6H / 24H / 7D</text>
  <rect x="484" y="200" width="70" height="2.5" fill="#7C3AED" opacity="0.7"/>

  <!-- 03 BOOSTER + OPTIMIZER -->
  <rect x="20" y="234" width="420" height="150" rx="10" fill="#10131C" stroke="#232A3A"/>
  <rect x="20" y="234" width="4" height="150" rx="2" fill="url(#cRailB)"/>
  <text x="44" y="264" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="2.2" fill="#22D3EE">03 // BOOSTER + OPTIMIZER</text>
  <text x="44" y="294" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F3F5F9">Reversible by design</text>
  <text x="44" y="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">Frees resources and applies safe tweaks</text>
  <text x="44" y="340" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">for a session, then restores every change.</text>
  <text x="44" y="360" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#4E5A70">POWER PLAN &#183; BACKGROUND APPS &#183; UNDO</text>
  <rect x="44" y="368" width="70" height="2.5" fill="#A855F7" opacity="0.7"/>

  <!-- 04 SIGNED AUTO-UPDATE -->
  <rect x="460" y="234" width="420" height="150" rx="10" fill="#10131C" stroke="#232A3A"/>
  <rect x="460" y="234" width="4" height="150" rx="2" fill="url(#cRailA)"/>
  <text x="484" y="264" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="2.2" fill="#22D3EE">04 // SIGNED AUTO-UPDATE</text>
  <text x="484" y="294" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F3F5F9">Verified before install</text>
  <text x="484" y="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">Every build is minisign (Ed25519) signed</text>
  <text x="484" y="340" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#98A2B6">and checked against the embedded key.</text>
  <text x="484" y="360" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#4E5A70">FAIL-CLOSED &#183; SHA-256 CHECKSUMS</text>
  <rect x="484" y="368" width="70" height="2.5" fill="#22D3EE" opacity="0.7"/>
</svg>
