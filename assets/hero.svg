<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Gaza Ibrahim — Building things that feel like magic, mostly in Rust and TypeScript.">
  <!-- Self-contained dark HUD banner: carries its own background plus an inline
       copy of the NEXORA brand mark, so it looks identical on GitHub's light and
       dark themes and fetches no external asset. Designed at 900px = the width
       of GitHub's README column, so it is never scaled down. -->
  <defs>
    <linearGradient id="hBrand" x1="110" y1="90" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="hBolt" x1="256" y1="120" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="hGlow1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="hGlow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="hGlow3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <radialGradient id="hHalo" cx="0.85" cy="0" r="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hRule" x1="222" y1="0" x2="876" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hBeam" x1="196" y1="56" x2="196" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 H0 V50" fill="none" stroke="#161B28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="#0A0713"/>
  <rect width="900" height="260" fill="url(#hGrid)"/>
  <rect width="900" height="260" fill="url(#hHalo)"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#262E3F" stroke-width="2">
    <path d="M20 50 V20 H50"/>
    <path d="M880 210 V240 H850"/>
  </g>
  <path d="M20 50 V20 H50" fill="none" stroke="#A855F7" stroke-width="3"/>
  <path d="M880 210 V240 H850" fill="none" stroke="#22D3EE" stroke-width="3"/>

  <!-- NEXORA mark, inlined from brand/nexora-mark-glow.svg geometry -->
  <g transform="translate(0 40) scale(0.36)">
    <g opacity="0.8">
      <path d="M170 138 L230 190 L230 322 L170 374 Z" fill="#8B5CF6" filter="url(#hGlow2)"/>
      <path d="M282 190 L342 138 L342 374 L282 322 Z" fill="#3B82F6" filter="url(#hGlow2)"/>
      <path d="M256 128 L184 272 L236 272 L200 384 L328 228 L272 228 L312 128 Z" fill="#22D3EE" filter="url(#hGlow1)"/>
    </g>
    <path d="M170 138 L230 190 L230 322 L170 374 Z" fill="url(#hBrand)" filter="url(#hGlow3)"/>
    <path d="M282 190 L342 138 L342 374 L282 322 Z" fill="url(#hBrand)" filter="url(#hGlow3)"/>
    <path d="M256 128 L184 272 L236 272 L200 384 L328 228 L272 228 L312 128 Z" fill="url(#hBolt)" filter="url(#hGlow3)"/>
    <path d="M170 138 L230 190 L230 322 L170 374 Z" fill="url(#hBrand)"/>
    <path d="M282 190 L342 138 L342 374 L282 322 Z" fill="url(#hBrand)"/>
    <path d="M256 128 L184 272 L236 272 L200 384 L328 228 L272 228 L312 128 Z" fill="url(#hBolt)"/>
  </g>
  <text x="89" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3.4" fill="#B79CF5">NEXORA</text>

  <!-- Vertical HUD beam separating mark from copy -->
  <path d="M196 56 V204" stroke="url(#hBeam)" stroke-width="1.5"/>

  <!-- Label row -->
  <text x="222" y="50" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#6F7C93">// PLAYER.CARD</text>
  <text x="876" y="50" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#6F7C93">ID: GAZAHYP</text>
  <path d="M222 66 H876" stroke="url(#hRule)" stroke-width="1.5"/>

  <!-- Name + tagline -->
  <text x="222" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="1.2" fill="#F3F5F9">GAZA IBRAHIM</text>
  <text x="222" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#A6B0C2">Building things that feel like magic &#8212; mostly in Rust &amp; TypeScript.</text>

  <!-- Status line -->
  <text x="222" y="198" font-family="Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing="1.8" fill="#22D3EE">[ STATUS: SHIPPING ]</text>

  <!-- Footer strip -->
  <rect x="222" y="222" width="26" height="3" fill="#A855F7"/>
  <text x="260" y="227" font-family="Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.6" fill="#8A93A6">BATAM, INDONESIA&#160;&#160;//&#160;&#160;VISUAL COMMUNICATION DESIGN &#215; SOFTWARE</text>
</svg>
